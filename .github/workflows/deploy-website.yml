name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'home/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy home/ to tencent OpenResty
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" -r home/* "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/1panel/www/sites/ccsafe/index/"
          rm -f ~/.ssh/deploy_key
